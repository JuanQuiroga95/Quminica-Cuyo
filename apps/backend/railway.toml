[build]
buildCommand = "echo 'Skipping build, using pre-committed .medusa directory'"

[deploy]
startCommand = "rm -rf .medusa && cp -r medusa_build .medusa && mkdir -p .medusa/admin && cp -r .medusa/server/public/admin/. .medusa/admin/ && cp -r .medusa/server/public/admin/. admin/ && pnpm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3


