[build]
buildCommand = "echo 'Skipping build, using pre-committed .medusa directory'"

[deploy]
startCommand = "cd apps/backend && rm -rf .medusa && cp -r medusa_build .medusa && (mkdir -p .medusa/admin && cp .medusa/server/public/admin/index.html .medusa/admin/index.html || true) && pnpm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
